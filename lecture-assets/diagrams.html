<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESNav 5.0 — 講習会用図解</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: sans-serif;
    padding: 2rem 1rem;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    color: #3b82f6;
    margin-bottom: 3rem;
    letter-spacing: 0.05em;
  }

  section {
    max-width: 900px;
    margin: 0 auto 4rem;
  }

  section h2 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 1.2rem;
    padding-left: 0.8rem;
    border-left: 3px solid #3b82f6;
  }

  .svg-wrap {
    background: #1e293b;
    border-radius: 12px;
    border: 1px solid #334155;
    padding: 1.5rem;
    overflow-x: auto;
  }

  .svg-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<h1>ESNav 5.0 — 操作・仕組みガイド</h1>

<!-- ============================================================
     図1: 操作フロー図（横フロー）
     ============================================================ -->
<section>
  <h2>図1 &nbsp;操作フロー</h2>
  <div class="svg-wrap">
    <svg viewBox="0 0 860 160" xmlns="http://www.w3.org/2000/svg" aria-label="操作フロー図">
      <defs>
        <!-- ノード用グラデ -->
        <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1d4ed8"/>
          <stop offset="100%" stop-color="#1e40af"/>
        </linearGradient>
        <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16a34a"/>
          <stop offset="100%" stop-color="#15803d"/>
        </linearGradient>
        <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d97706"/>
          <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>
        <!-- 矢印マーカー -->
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
      </defs>

      <!-- ステップ定義: x, color-gradient, icon, line1, line2 -->

      <!-- Step 1: 境界作成 -->
      <rect x="10" y="30" width="140" height="100" rx="10" fill="url(#gBlue)" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- アイコン: 地図ピン風 -->
      <circle cx="80" cy="62" r="12" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="80" cy="62" r="5" fill="#93c5fd"/>
      <line x1="80" y1="74" x2="80" y2="82" stroke="#93c5fd" stroke-width="2"/>
      <!-- テキスト -->
      <text x="80" y="100" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">境界作成</text>
      <text x="80" y="117" text-anchor="middle" fill="#93c5fd" font-size="10">圃場の輪郭を登録</text>

      <!-- 矢印 1→2 -->
      <line x1="152" y1="80" x2="175" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2: 境界記録(REC) -->
      <rect x="178" y="30" width="140" height="100" rx="10" fill="url(#gBlue)" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- アイコン: 録画ボタン風 -->
      <circle cx="248" cy="65" r="14" fill="none" stroke="#f87171" stroke-width="2"/>
      <circle cx="248" cy="65" r="7" fill="#f87171"/>
      <text x="248" y="100" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">境界記録</text>
      <text x="248" y="117" text-anchor="middle" fill="#fca5a5" font-size="10">REC で走行記録</text>

      <!-- 矢印 2→3 -->
      <line x1="320" y1="80" x2="343" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 3: ガイドライン生成 -->
      <rect x="346" y="30" width="140" height="100" rx="10" fill="url(#gGreen)" stroke="#22c55e" stroke-width="1.5"/>
      <!-- アイコン: 並行線 -->
      <line x1="388" y1="54" x2="424" y2="54" stroke="#86efac" stroke-width="2"/>
      <line x1="388" y1="64" x2="424" y2="64" stroke="#86efac" stroke-width="2"/>
      <line x1="388" y1="74" x2="424" y2="74" stroke="#86efac" stroke-width="2"/>
      <text x="416" y="100" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">ガイドライン生成</text>
      <text x="416" y="117" text-anchor="middle" fill="#86efac" font-size="10">AB線 / 自由曲線</text>

      <!-- 矢印 3→4 -->
      <line x1="488" y1="80" x2="511" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4: 線の確認 -->
      <rect x="514" y="30" width="140" height="100" rx="10" fill="url(#gYellow)" stroke="#fbbf24" stroke-width="1.5"/>
      <!-- アイコン: チェックマーク -->
      <circle cx="584" cy="64" r="14" fill="none" stroke="#fde68a" stroke-width="2"/>
      <polyline points="574,64 581,71 595,57" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="584" y="100" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">線の確認</text>
      <text x="584" y="117" text-anchor="middle" fill="#fde68a" font-size="10">位置・間隔を確認</text>

      <!-- 矢印 4→5 -->
      <line x1="656" y1="80" x2="679" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 5: 自動走行 -->
      <rect x="682" y="30" width="168" height="100" rx="10" fill="#1e3a5f" stroke="#22c55e" stroke-width="2.5"/>
      <!-- アイコン: トラクター風（簡略） -->
      <!-- 車体 -->
      <rect x="730" y="50" width="38" height="22" rx="4" fill="none" stroke="#86efac" stroke-width="2"/>
      <!-- 前輪 -->
      <circle cx="742" cy="76" r="6" fill="none" stroke="#86efac" stroke-width="2"/>
      <!-- 後輪 -->
      <circle cx="760" cy="76" r="8" fill="none" stroke="#86efac" stroke-width="2"/>
      <!-- キャビン -->
      <rect x="743" y="44" width="16" height="10" rx="2" fill="none" stroke="#86efac" stroke-width="1.5"/>
      <text x="766" y="101" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">自動走行</text>
      <text x="766" y="118" text-anchor="middle" fill="#86efac" font-size="10">GPS追従スタート</text>
    </svg>
  </div>
</section>


<!-- ============================================================
     図2: RTK-GPS 仕組み図
     ============================================================ -->
<section>
  <h2>図2 &nbsp;RTK-GPS の仕組み</h2>
  <div class="svg-wrap">
    <svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" aria-label="RTK-GPS仕組み図">
      <defs>
        <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
        <marker id="arrow2b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
        </marker>
        <marker id="arrow2y" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
        </marker>
        <!-- 点線用 -->
        <marker id="arrow2d" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
        </marker>
      </defs>

      <!-- ===== 最上部: 衛星群 ===== -->
      <!-- GPS衛星 1 -->
      <g transform="translate(120, 30)">
        <rect x="-40" y="0" width="80" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
        <!-- 衛星本体 -->
        <rect x="-8" y="15" width="16" height="24" rx="3" fill="none" stroke="#93c5fd" stroke-width="2"/>
        <!-- ソーラーパネル -->
        <rect x="-32" y="21" width="20" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="12" y="21" width="20" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <!-- アンテナ -->
        <line x1="0" y1="15" x2="0" y2="8" stroke="#93c5fd" stroke-width="1.5"/>
        <circle cx="0" cy="6" r="2.5" fill="#93c5fd"/>
        <text x="0" y="53" text-anchor="middle" fill="#93c5fd" font-size="10">GPS衛星</text>
      </g>

      <!-- GPS衛星 2 -->
      <g transform="translate(300, 10)">
        <rect x="-40" y="0" width="80" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="-8" y="15" width="16" height="24" rx="3" fill="none" stroke="#93c5fd" stroke-width="2"/>
        <rect x="-32" y="21" width="20" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="12" y="21" width="20" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <line x1="0" y1="15" x2="0" y2="8" stroke="#93c5fd" stroke-width="1.5"/>
        <circle cx="0" cy="6" r="2.5" fill="#93c5fd"/>
        <text x="0" y="53" text-anchor="middle" fill="#93c5fd" font-size="10">GPS衛星</text>
      </g>

      <!-- みちびき（準天頂衛星） -->
      <g transform="translate(500, 20)">
        <rect x="-48" y="0" width="96" height="64" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
        <rect x="-8" y="15" width="16" height="26" rx="3" fill="none" stroke="#fde68a" stroke-width="2"/>
        <rect x="-36" y="22" width="24" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="12" y="22" width="24" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <line x1="0" y1="15" x2="0" y2="6" stroke="#fde68a" stroke-width="1.5"/>
        <circle cx="0" cy="4" r="3" fill="#fde68a"/>
        <!-- バッジ -->
        <rect x="16" y="0" width="28" height="14" rx="4" fill="#854d0e"/>
        <text x="30" y="10" text-anchor="middle" fill="#fde68a" font-size="8" font-weight="700">みちびき</text>
        <text x="0" y="57" text-anchor="middle" fill="#fde68a" font-size="10">準天頂衛星</text>
      </g>

      <!-- ===== 測位信号の矢印（衛星 → 基地局・トラクター） ===== -->
      <!-- GPS衛星1 → 基地局 -->
      <line x1="120" y1="92" x2="200" y2="195" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow2d)"/>
      <!-- GPS衛星2 → 基地局 -->
      <line x1="300" y1="72" x2="220" y2="195" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow2d)"/>
      <!-- みちびき → 基地局 -->
      <line x1="470" y1="86" x2="265" y2="195" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow2y)"/>
      <!-- みちびき → トラクター -->
      <line x1="510" y1="86" x2="590" y2="245" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow2y)"/>
      <!-- GPS衛星1 → トラクター -->
      <line x1="148" y1="92" x2="545" y2="248" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow2d)"/>
      <!-- GPS衛星2 → トラクター -->
      <line x1="310" y1="72" x2="558" y2="248" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow2d)"/>

      <!-- ===== 基地局 ===== -->
      <g transform="translate(120, 195)">
        <rect x="0" y="0" width="180" height="90" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
        <!-- アンテナタワー -->
        <line x1="90" y1="0" x2="90" y2="-20" stroke="#86efac" stroke-width="2.5"/>
        <line x1="72" y1="-8" x2="108" y2="-8" stroke="#86efac" stroke-width="1.5"/>
        <line x1="78" y1="-14" x2="102" y2="-14" stroke="#86efac" stroke-width="1.5"/>
        <!-- 電波紋 -->
        <path d="M68,-22 Q90,-38 112,-22" fill="none" stroke="#86efac" stroke-width="1.5"/>
        <path d="M58,-28 Q90,-50 122,-28" fill="none" stroke="#86efac" stroke-width="1" opacity="0.5"/>
        <text x="90" y="30" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">基地局</text>
        <text x="90" y="50" text-anchor="middle" fill="#86efac" font-size="11">（固定点・既知座標）</text>
        <text x="90" y="70" text-anchor="middle" fill="#94a3b8" font-size="10">誤差を算出・補正データ生成</text>
      </g>

      <!-- ===== 補正データ → トラクター ===== -->
      <line x1="305" y1="240" x2="498" y2="290" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow2b)"/>
      <rect x="330" y="247" width="130" height="26" rx="6" fill="#0f172a"/>
      <text x="395" y="265" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">補正データ（RTK）</text>

      <!-- ===== トラクター受信機 ===== -->
      <g transform="translate(455, 245)">
        <rect x="0" y="0" width="195" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
        <!-- GPSアンテナ（球） -->
        <circle cx="97" cy="-14" r="12" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
        <circle cx="97" cy="-14" r="5" fill="#93c5fd"/>
        <line x1="97" y1="-2" x2="97" y2="0" stroke="#93c5fd" stroke-width="2"/>
        <text x="97" y="32" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">トラクター受信機</text>
        <text x="97" y="52" text-anchor="middle" fill="#93c5fd" font-size="11">RTKで±2cm精度</text>
        <text x="97" y="72" text-anchor="middle" fill="#94a3b8" font-size="10">位置情報をコントローラに送信</text>
      </g>

      <!-- ===== 制御信号 → 油圧モーター ===== -->
      <line x1="552" y1="342" x2="552" y2="388" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow2b)"/>
      <rect x="470" y="348" width="120" height="24" rx="6" fill="#0f172a"/>
      <text x="530" y="364" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">制御信号</text>

      <!-- ===== 油圧モーター ===== -->
      <g transform="translate(420, 390)">
        <rect x="0" y="0" width="260" height="80" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
        <!-- 歯車アイコン -->
        <circle cx="50" cy="40" r="18" fill="none" stroke="#fde68a" stroke-width="2"/>
        <circle cx="50" cy="40" r="10" fill="none" stroke="#fde68a" stroke-width="2"/>
        <!-- 歯 -->
        <rect x="47" y="20" width="6" height="6" rx="1" fill="#fde68a"/>
        <rect x="47" y="54" width="6" height="6" rx="1" fill="#fde68a"/>
        <rect x="30" y="37" width="6" height="6" rx="1" fill="#fde68a"/>
        <rect x="64" y="37" width="6" height="6" rx="1" fill="#fde68a"/>
        <!-- ハンドル -->
        <circle cx="50" cy="40" r="5" fill="#fde68a"/>
        <text x="145" y="33" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">油圧モーター</text>
        <text x="145" y="53" text-anchor="middle" fill="#fde68a" font-size="11">ハンドルを自動制御</text>
        <text x="145" y="70" text-anchor="middle" fill="#94a3b8" font-size="10">ガイドライン追従走行</text>
      </g>

      <!-- 凡例 -->
      <g transform="translate(30, 420)">
        <line x1="0" y1="10" x2="30" y2="10" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 3"/>
        <text x="36" y="14" fill="#94a3b8" font-size="10">測位信号（GPS/みちびき）</text>
        <line x1="0" y1="30" x2="30" y2="30" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 3"/>
        <text x="36" y="34" fill="#94a3b8" font-size="10">みちびき補強信号</text>
        <line x1="0" y1="50" x2="30" y2="50" stroke="#22c55e" stroke-width="2.5"/>
        <text x="36" y="54" fill="#94a3b8" font-size="10">補正・制御データ</text>
      </g>
    </svg>
  </div>
</section>


<!-- ============================================================
     図3: AB線 vs 自由曲線の比較図
     ============================================================ -->
<section>
  <h2>図3 &nbsp;ガイドライン比較 — AB線 vs 自由曲線</h2>
  <div class="svg-wrap">
    <svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" aria-label="AB線と自由曲線の比較図">
      <defs>
        <clipPath id="clipLeft">
          <rect x="20" y="20" width="360" height="210"/>
        </clipPath>
        <clipPath id="clipRight">
          <rect x="440" y="20" width="360" height="210"/>
        </clipPath>
      </defs>

      <!-- ========== 左パネル: AB線 ========== -->
      <!-- パネル背景 -->
      <rect x="20" y="20" width="360" height="210" rx="10" fill="#0f2027" stroke="#1e40af" stroke-width="2"/>
      <!-- ラベル -->
      <rect x="30" y="28" width="70" height="22" rx="5" fill="#1d4ed8"/>
      <text x="65" y="43" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">AB 線</text>

      <!-- 圃場（四角形） -->
      <rect x="55" y="52" width="290" height="162" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="2"/>

      <!-- A点・B点ラベル -->
      <circle cx="68" cy="65" r="7" fill="#3b82f6"/>
      <text x="68" y="69" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">A</text>
      <circle cx="332" cy="65" r="7" fill="#ef4444"/>
      <text x="332" y="69" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">B</text>

      <!-- 平行なAB線（まっすぐ） -->
      <line x1="68" y1="65" x2="332" y2="65" stroke="#fbbf24" stroke-width="2.5"/>
      <line x1="68" y1="85" x2="332" y2="85" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>
      <line x1="68" y1="105" x2="332" y2="105" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>
      <line x1="68" y1="125" x2="332" y2="125" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>
      <line x1="68" y1="145" x2="332" y2="145" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>
      <line x1="68" y1="165" x2="332" y2="165" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>
      <line x1="68" y1="185" x2="332" y2="185" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>
      <line x1="68" y1="205" x2="332" y2="205" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8 3"/>

      <!-- トラクターアイコン（左パネル） -->
      <g transform="translate(160, 95)">
        <rect x="-12" y="-8" width="24" height="14" rx="3" fill="#22c55e" opacity="0.9"/>
        <circle cx="-6" cy="8" r="5" fill="#22c55e"/>
        <circle cx="8" cy="8" r="7" fill="#22c55e"/>
        <rect x="-3" y="-14" width="10" height="8" rx="1" fill="#22c55e" opacity="0.7"/>
      </g>

      <!-- ========== 右パネル: 自由曲線 ========== -->
      <rect x="440" y="20" width="360" height="210" rx="10" fill="#0f2027" stroke="#7c3aed" stroke-width="2"/>
      <!-- ラベル -->
      <rect x="450" y="28" width="70" height="22" rx="5" fill="#7c3aed"/>
      <text x="485" y="43" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">自由曲線</text>

      <!-- 変形圃場（多角形） -->
      <polygon points="460,58 750,52 770,175 580,215 460,210" fill="#14532d" stroke="#22c55e" stroke-width="2"/>

      <!-- カーブしたガイドライン（自由曲線） -->
      <!-- ベースカーブ（記録線） -->
      <path d="M465,70 Q560,58 660,65 Q720,70 758,80" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <!-- 並行カーブ群 -->
